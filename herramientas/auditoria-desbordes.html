<!doctype html>
<meta charset="utf-8">
<title>Auditoría de desbordes</title>
<style>
  body { font-family: ui-monospace, monospace; font-size: 13px; margin: 16px; }
  iframe { height: 1400px; border: 0; position: absolute; left: -9999px; }
  pre { white-space: pre-wrap; }
</style>
<pre id="out">auditando…</pre>
<script>
const ROUTES = [
  "/", "/asistente", "/animo", "/inicio", "/ejercicios", "/ejercicios/caminar", "/nutricion",
  "/nutricion/receta/sopa-verduras", "/medicamentos", "/cognitivo",
  "/cognitivo/memoria-palabras", "/rutina", "/emergencia",
];

const lines = [];
const log = (t) => lines.push(t);

function describe(el) {
  const tag = el.tagName.toLowerCase();
  const cls = (el.className && typeof el.className === "string")
    ? "." + el.className.trim().split(/\s+/).slice(0, 3).join(".")
    : "";
  const text = (el.textContent || "").trim().slice(0, 40);
  return tag + cls + ' "' + text + '"';
}

function audit(doc) {
  const problems = [];
  const bodyRect = doc.body.getBoundingClientRect();

  // 1. La página entera tiene scroll horizontal
  if (doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 1) {
    problems.push("PAGINA con scroll horizontal: "
      + doc.documentElement.scrollWidth + " > " + doc.documentElement.clientWidth);
  }

  // 2. Elementos que sobresalen del cuerpo
  for (const el of doc.querySelectorAll("body *")) {
    const r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) continue;
    if (r.right > bodyRect.right + 0.5 || r.left < bodyRect.left - 0.5) {
      problems.push("SE SALE DEL CUERPO (" + r.left.toFixed(0) + " a " + r.right.toFixed(0)
        + " vs " + bodyRect.left.toFixed(0) + " a " + bodyRect.right.toFixed(0) + "): " + describe(el));
    }
  }

  // 3. Contenido más ancho que su propia caja.
  //    Se miran los contenedores, NO sólo las hojas: un span en línea tiene
  //    clientWidth 0, así que el desborde sólo es medible en el bloque que lo
  //    contiene. Quien declara overflow-x propio queda fuera: ahí es a propósito.
  for (const el of doc.querySelectorAll("body *")) {
    // Cajas de menos de 4px no son contenedores: son ayudas ocultas como
    // .sr-only (1px + overflow hidden), donde que el texto "desborde" es
    // justo el mecanismo. Medirlas daba un falso positivo en cada pantalla.
    if (el.clientWidth < 4) continue;
    const style = doc.defaultView.getComputedStyle(el);
    if (style.overflowX === "auto" || style.overflowX === "scroll") continue;
    if (el.scrollWidth > el.clientWidth + 1) {
      problems.push("CONTENIDO DESBORDADO (" + el.scrollWidth + " > " + el.clientWidth + "): " + describe(el));
    }
  }

  // 4. Palabras mas anchas que su propia caja. Con overflow-wrap: break-word
  //    el navegador las parte por la mitad y el texto se lee cortado.
  //
  //    Se mide con un span real dentro del mismo documento, copiando la
  //    tipografia calculada. Con canvas.measureText salian decenas de falsos
  //    positivos: no aplica el letter-spacing negativo del diseno ni resuelve
  //    la fuente variable, asi que inflaba cada palabra uno o dos pixeles.
  var regla = doc.getElementById("__regla__");
  if (!regla) {
    regla = doc.createElement("span");
    regla.id = "__regla__";
    regla.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:-99999px;top:0";
    doc.body.appendChild(regla);
  }

  for (const el of doc.querySelectorAll("body *")) {
    if (el.id === "__regla__") continue;
    if (el.children.length > 0) continue;            // solo hojas con texto
    var texto = (el.textContent || "").trim();
    if (!texto || el.clientWidth < 4) continue;
    var estilo = doc.defaultView.getComputedStyle(el);
    if (estilo.whiteSpace === "nowrap" || estilo.whiteSpace === "pre") continue;

    regla.style.fontFamily = estilo.fontFamily;
    regla.style.fontSize = estilo.fontSize;
    regla.style.fontWeight = estilo.fontWeight;
    regla.style.fontStyle = estilo.fontStyle;
    regla.style.letterSpacing = estilo.letterSpacing;
    regla.style.textTransform = estilo.textTransform;

    var anchoMax = 0;
    var peor = "";
    texto.split(" ").forEach(function (palabra) {
      if (!palabra) return;
      regla.textContent = palabra;
      var w = regla.getBoundingClientRect().width;
      if (w > anchoMax) { anchoMax = w; peor = palabra; }
    });

    if (anchoMax > el.clientWidth + 0.5) {
      problems.push("PALABRA CORTADA (" + anchoMax.toFixed(0) + " > " + el.clientWidth
        + '): "' + peor + '" en ' + describe(el));
    }
  }

  return problems;
}

async function auditFrame(frame) {
  document.body.appendChild(frame);
  await new Promise((res) => { frame.onload = res; });
  try { await frame.contentDocument.fonts.ready; } catch (e) {}
  await new Promise((res) => setTimeout(res, 900));    // datos que llegan por fetch
  const problems = audit(frame.contentDocument);
  frame.remove();
  return problems;
}

const WIDTHS = [320, 360, 390, 430, 480];

(async () => {
  let total = 0;

  // Deja la sesion iniciada y un asistente elegido: si no, /animo e /inicio
  // se auditarian sin la ilustracion ni la tarjeta.
  try {
    localStorage.setItem("misalud.sesion", "ok");
    localStorage.setItem("misalud.asistente", "lucia");
  } catch (e) {}

  for (const width of WIDTHS) {
    let subtotal = 0;
    const detail = [];
    for (const route of ROUTES) {
      const frame = document.createElement("iframe");
      frame.style.width = width + "px";
      frame.src = route;
      const problems = await auditFrame(frame);
      subtotal += problems.length;
      if (problems.length) {
        detail.push("    " + route + ": " + problems.length);
        for (const p of problems.slice(0, 2)) detail.push("        " + p);
      }
    }
    total += subtotal;
    log((subtotal ? "FALLA " : "ok    ") + width + "px -> " + subtotal + " problema(s)");
    for (const d of detail) log(d);
  }

  // Control: un desborde deliberado. Si esto no salta, el detector miente.
  const control = document.createElement("iframe");
  control.srcdoc = [
    '<!doctype html><meta charset="utf-8">',
    '<style>body{margin:0;width:320px;overflow-wrap:normal}',
    '.caja{width:120px;padding:10px;border:1px solid #000}</style>',
    '<div class="caja"><span style="font-size:40px;font-weight:800">Medicamentos</span></div>',
  ].join("");
  const controlProblems = await auditFrame(control);

  log("");
  log("control (desborde deliberado): " + controlProblems.length + " detectado(s) -> "
    + (controlProblems.length > 0 ? "el detector FUNCIONA" : "el detector NO SIRVE"));
  for (const p of controlProblems.slice(0, 3)) log("    " + p);

  log("");
  log("TOTAL en la app: " + total + " problema(s)");

  document.getElementById("out").textContent = lines.join("\n");
})();
</script>
